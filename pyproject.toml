[project]
name = "ortfinder"
version = "0.1.0"
description = "Findet heraus, wo ein Foto aufgenommen wurde - EXIF, KI-Bildanalyse und OpenStreetMap-Abgleich."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pillow-heif>=0.18",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ortfinder = "ortfinder.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ortfinder"]

[tool.setuptools.package-data]
ortfinder = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
